<svg
  width="720"
  height="300"
  viewBox="0 0 720 300"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="720" y2="300">
      <stop offset="0%" stop-color="#050806"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>

    <filter id="greenGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Card -->
  <rect
    x="2"
    y="2"
    width="716"
    height="296"
    rx="14"
    fill="url(#background)"
    stroke="#30363D"
    stroke-width="2"
  />

  <!-- Terminal header -->
  <circle cx="28" cy="26" r="5" fill="#FF5F56"/>
  <circle cx="46" cy="26" r="5" fill="#FFBD2E"/>
  <circle cx="64" cy="26" r="5" fill="#27C93F"/>

  <text
    x="90"
    y="31"
    fill="#8B949E"
    font-family="Consolas, Courier New, monospace"
    font-size="13"
  >
    dariel@github:~/projects/artemis-banking
  </text>

  <line
    x1="20"
    y1="48"
    x2="700"
    y2="48"
    stroke="#21262D"
  />

  <!-- Prompt -->
  <text
    x="28"
    y="80"
    fill="#39FF14"
    font-family="Consolas, Courier New, monospace"
    font-size="14"
  >
    dariel@github:~$ cat project.info
  </text>

  <!-- Project -->
  <text
    x="28"
    y="118"
    fill="#F0F6FC"
    font-family="Consolas, Courier New, monospace"
    font-size="25"
    font-weight="700"
  >
    ARTEMIS-BANKING
  </text>

  <text
    x="28"
    y="150"
    fill="#8B949E"
    font-family="Consolas, Courier New, monospace"
    font-size="14"
  >
    Sistema de gestión bancaria desarrollado con C# y ASP.NET MVC.
  </text>

  <text
    x="28"
    y="172"
    fill="#8B949E"
    font-family="Consolas, Courier New, monospace"
    font-size="14"
  >
    Gestión de clientes, cuentas, préstamos y transacciones.
  </text>

  <!-- C# -->
  <rect
    x="28"
    y="202"
    width="68"
    height="30"
    rx="5"
    fill="#000000"
    stroke="#39FF14"
  />

  <text
    x="62"
    y="222"
    fill="#39FF14"
    text-anchor="middle"
    font-family="Consolas, Courier New, monospace"
    font-size="12"
    font-weight="700"
  >
    C#
  </text>

  <!-- ASP.NET -->
  <rect
    x="106"
    y="202"
    width="112"
    height="30"
    rx="5"
    fill="#000000"
    stroke="#39FF14"
  />

  <text
    x="162"
    y="222"
    fill="#39FF14"
    text-anchor="middle"
    font-family="Consolas, Courier New, monospace"
    font-size="12"
    font-weight="700"
  >
    ASP.NET MVC
  </text>

  <!-- SQL Server -->
  <rect
    x="228"
    y="202"
    width="108"
    height="30"
    rx="5"
    fill="#000000"
    stroke="#39FF14"
  />

  <text
    x="282"
    y="222"
    fill="#39FF14"
    text-anchor="middle"
    font-family="Consolas, Courier New, monospace"
    font-size="12"
    font-weight="700"
  >
    SQL SERVER
  </text>

  <!-- Fake terminal action -->
  <text
    x="28"
    y="268"
    fill="#39FF14"
    font-family="Consolas, Courier New, monospace"
    font-size="14"
    filter="url(#greenGlow)"
  >
    &gt;_ OPEN_REPOSITORY
  </text>

  <!-- Cursor -->
  <rect
    x="199"
    y="255"
    width="8"
    height="16"
    fill="#39FF14"
  >
    <animate
      attributeName="opacity"
      values="1;0;1"
      dur="1s"
      repeatCount="indefinite"
    />
  </rect>

</svg>
